<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geo-Maze Challenge - fran_giga</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px 5px;
      touch-action: manipulation;
    }
    #game-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #1e2b1e;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #2e7d32;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .hud {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      font-weight: bold;
      background: #0a140a;
      padding: 8px 15px;
      border-radius: 6px;
      color: #4caf50;
    }
    canvas {
      background: #0d1a0d;
      border: 2px solid #4caf50;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    /* D-Pad para Táctil/Móviles */
    .controls-dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
      justify-content: center;
      margin-top: 15px;
    }
    .btn-dir {
      background: #2e7d32;
      color: #fff;
      border: none;
      font-size: 1.5em;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .btn-dir:active { background: #4caf50; }
    .btn-reset {
      margin-top: 10px;
      padding: 10px 20px;
      background: #ff9800;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      color: #000;
    }
    #reward {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #1b3e1b;
      border: 2px solid #ffd700;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <h2 style="margin-top:0; color:#4caf50; font-size: 1.4em;">🧭 Geo-Maze Challenge 🧭</h2>
  
  <div class="hud">
    <span>Mueve 1P hasta GC</span>
  </div>

  <canvas id="mazeCanvas" width="385" height="385"></canvas>

  <!-- D-Pad para Móvil -->
  <div class="controls-dpad">
    <div></div>
    <button class="btn-dir" onclick="movePlayer('up')">▲</button>
    <div></div>
    <button class="btn-dir" onclick="movePlayer('left')">◄</button>
    <button class="btn-dir" onclick="movePlayer('down')">▼</button>
    <button class="btn-dir" onclick="movePlayer('right')">►</button>
  </div>

  <button class="btn-reset" onclick="initGame()">Reiniciar Posición</button>

  <!-- Mensaje Final -->
  <div id="reward">
    <h3 style="color:#ffd700; margin-top:0; white-space: nowrap;">🎉 ¡¡¡ENHORABUENA!!! 🎉</h3>
    <p style="margin:5px 0;">Has conseguido salir del laberinto!</p>
    <p style="font-size:1.2em; color:#4caf50; margin:5px 0 0 0;">Clave Certitude: <strong>HAY-SALIDA</strong></p>
  </div>
</div>

<script>
  const canvas = document.getElementById('mazeCanvas');
  const ctx = canvas.getContext('2d');

  // Rejilla de 35x35 casillas
  const cols = 35;
  const rows = 35;
  const cellSize = canvas.width / cols; // 11px por casilla

  let grid = [];
  let player = { x: 0, y: 0 };
  let goal = { x: cols - 1, y: rows - 1 };
  let gameActive = true;

  // Generador de laberinto perfecto (DFS) con semilla fija
  function generateMaze() {
    grid = Array.from({ length: rows }, () => Array(cols).fill(1));

    let seed = 98765;
    function pseudoRandom() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }

    let stack = [];
    let startCell = { x: 0, y: 0 };
    grid[0][0] = 0;
    stack.push(startCell);

    while (stack.length > 0) {
      let current = stack[stack.length - 1];
      let neighbors = [];

      let directions = [
        { dx: 0, dy: -2 }, // Arriba
        { dx: 0, dy: 2 },  // Abajo
        { dx: -2, dy: 0 }, // Izquierda
        { dx: 2, dy: 0 }   // Derecha
      ];

      for (let dir of directions) {
        let nx = current.x + dir.dx;
        let ny = current.y + dir.dy;

        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && grid[ny][nx] === 1) {
          neighbors.push({ x: nx, y: ny, dir });
        }
      }

      if (neighbors.length > 0) {
        let chosenIndex = Math.floor(pseudoRandom() * neighbors.length);
        let chosen = neighbors[chosenIndex];

        grid[current.y + chosen.dir.dy / 2][current.x + chosen.dir.dx / 2] = 0;
        grid[chosen.y][chosen.x] = 0;

        stack.push({ x: chosen.x, y: chosen.y });
      } else {
        stack.pop();
      }
    }

    // Apertura asegurada en la salida
    grid[rows - 1][cols - 1] = 0;
    grid[rows - 1][cols - 2] = 0;
  }

  function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c] === 1) {
          ctx.fillStyle = '#1b5e20'; // Muro
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        } else {
          ctx.strokeStyle = '#143314'; // Pasillo
          ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }
    }

    // Configuración compartida de alineación de texto para el renderizador del canvas
    ctx.font = 'bold 7px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Meta ("GC")
    const goalCenterX = (goal.x + 0.5) * cellSize;
    const goalCenterY = (goal.y + 0.5) * cellSize;

    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(goalCenterX, goalCenterY, cellSize / 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.fillText('GC', goalCenterX, goalCenterY + 0.5);

    // Jugador ("1P")
    const playerCenterX = (player.x + 0.5) * cellSize;
    const playerCenterY = (player.y + 0.5) * cellSize;

    ctx.fillStyle = '#00bcd4';
    ctx.beginPath();
    ctx.arc(playerCenterX, playerCenterY, cellSize / 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000000';
    ctx.fillText('1P', playerCenterX, playerCenterY + 0.5);
  }

  function movePlayer(dir) {
    if (!gameActive) return;

    let newX = player.x;
    let newY = player.y;

    if (dir === 'up') newY--;
    if (dir === 'down') newY++;
    if (dir === 'left') newX--;
    if (dir === 'right') newX++;

    if (newX >= 0 && newX < cols && newY >= 0 && newY < rows) {
      if (grid[newY][newX] === 0) {
        player.x = newX;
        player.y = newY;
        drawMap();
        checkWin();
      }
    }
  }

  // Teclado PC
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') movePlayer('up');
    if (e.key === 'ArrowDown') movePlayer('down');
    if (e.key === 'ArrowLeft') movePlayer('left');
    if (e.key === 'ArrowRight') movePlayer('right');
  });

  function checkWin() {
    if (player.x === goal.x && player.y === goal.y) {
      gameActive = false;
      document.getElementById('reward').style.display = 'block';
    }
  }

  function initGame() {
    generateMaze();
    player = { x: 0, y: 0 };
    gameActive = false; // Prevención previa de estado
    gameActive = true;
    document.getElementById('reward').style.display = 'none';
    drawMap();
  }

  initGame();
</script>

</body>
</html>
